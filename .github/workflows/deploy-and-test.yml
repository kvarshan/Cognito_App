name: Live E2E Verification & CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Selenium — Website Tests (300)
  # ============================================================================
  selenium-web-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl requests

      - name: Run 300 Selenium Website Tests
        env:
          BASE_URL: "https://kvarshan.github.io/Cognito_App/"
          HEADLESS: "true"
        run: |
          python automation/run_all_tests.py --suite website --output reports/selenium

      - name: Upload Selenium Web Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium/
          retention-days: 30

  # ============================================================================
  # 2. Appium — Android Tests (300)
  # ============================================================================
  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run 300 Appium Android Mobile Tests
        run: |
          python automation/run_all_tests.py --suite android --output reports/android

      - name: Upload Appium Android Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/android/
          retention-days: 30

  # ============================================================================
  # 3. Unit Tests — API (300)
  # ============================================================================
  unit-api-tests:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests fastapi pydantic scikit-learn numpy

      - name: Run 300 Unit API Tests
        run: |
          python automation/run_all_tests.py --suite api --output reports/api

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/api/
          retention-days: 30

  # ============================================================================
  # 4. Validation Tests (300)
  # ============================================================================
  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pypdf python-docx python-pptx

      - name: Run 300 Validation Tests
        run: |
          python automation/run_all_tests.py --suite validation --output reports/validation

      - name: Upload Validation Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation/
          retention-days: 30

  # ============================================================================
  # 5. Deployment Status (300)
  # ============================================================================
  deployment-status-tests:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run 300 Deployment Status & Health Tests
        env:
          BASE_URL: "https://kvarshan.github.io/Cognito_App/"
        run: |
          python automation/run_all_tests.py --suite deployment --output reports/deployment

      - name: Upload Deployment Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment/
          retention-days: 30

  # ============================================================================
  # 6. Load Testing — Performance (300)
  # ============================================================================
  load-performance-tests:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl numpy scikit-learn

      - name: Run 300 Load & Performance Tests
        run: |
          python automation/run_all_tests.py --suite load --output reports/load

      - name: Upload Load Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load/
          retention-days: 30

  # ============================================================================
  # 7. Compile Master Report & Deploy
  # ============================================================================
  compile-master-report-and-deploy:
    name: Compile Master Report & Deploy
    needs: [selenium-web-tests, appium-android-tests, unit-api-tests, validation-tests, deployment-status-tests, load-performance-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Compile Master 1800 Test Report
        run: |
          python automation/run_all_tests.py --suite all --output reports/master

      - name: Upload Full E2E Master Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: reports/master/
          retention-days: 30

      - name: Publish GitHub Step Summary
        if: always()
        run: |
          cat reports/master/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Prepare GitHub Pages Deployment Directory
        run: |
          mkdir -p public
          cp -r frontend/* public/
          cp reports/master/*.html public/
          cp reports/master/*.xlsx public/
          cp reports/master/*.json public/
          cp reports/master/*.md public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
